name: Controlled Linux Validation
run-name: "Controlled Linux validation"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-linux-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment:
      name: brain-validation
    permissions:
      contents: read
    steps:
      - name: Prepare trusted generic executor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docker-context"
          base="https://raw.githubusercontent.com/aviajubs-ux/validation-gateway/$GITHUB_SHA"
          curl --fail --location --silent --show-error "$base/.github/docker/linux-validation.Dockerfile" -o "$RUNNER_TEMP/docker-context/Dockerfile"
          curl --fail --location --silent --show-error "$base/.github/scripts/execute-linux-inner.sh" -o "$RUNNER_TEMP/docker-context/execute-linux-inner.sh"
          chmod 0555 "$RUNNER_TEMP/docker-context/execute-linux-inner.sh"
          curl --fail --location --silent --show-error "$base/.github/scripts/execute-linux.sh" -o "$RUNNER_TEMP/execute-linux.sh"
          chmod 0555 "$RUNNER_TEMP/execute-linux.sh"
          echo "TRUSTED_LINUX_EXECUTOR_READY"
      - name: Validate Lane 02 configuration
        id: preflight
        shell: bash
        env:
          SOURCE_URL_02: ${{ secrets.SOURCE_URL_02 }}
          SOURCE_SHA256_02: ${{ secrets.SOURCE_SHA256_02 }}
          EVIDENCE_KEY_B64_02: ${{ secrets.EVIDENCE_KEY_B64_02 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${SOURCE_URL_02:-}" ]] || missing+=("SOURCE_URL_02")
          [[ -n "${SOURCE_SHA256_02:-}" ]] || missing+=("SOURCE_SHA256_02")
          [[ -n "${EVIDENCE_KEY_B64_02:-}" ]] || missing+=("EVIDENCE_KEY_B64_02")
          if (( ${#missing[@]} )); then
            printf 'CONFIG_MISSING_SECRETS: %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "$SOURCE_URL_02" == https://* ]] || { echo "CONFIG_SOURCE_URL_INVALID"; exit 1; }
          [[ "$SOURCE_SHA256_02" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "CONFIG_SHA256_INVALID"; exit 1; }
          key_len="$(printf '%s' "$EVIDENCE_KEY_B64_02" | base64 --decode 2>/dev/null | wc -c)"
          [[ "$key_len" -eq 32 ]] || { echo "CONFIG_EVIDENCE_KEY_INVALID"; exit 1; }
          echo "LANE_02_CONFIGURATION_VALID"
      - name: Download, verify, isolate and validate Candidate
        id: execute
        if: ${{ steps.preflight.outcome == 'success' }}
        shell: bash
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL_02 }}
          SOURCE_SHA256: ${{ secrets.SOURCE_SHA256_02 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docker-context"
          "$RUNNER_TEMP/execute-linux.sh"
      - name: Seal evidence
        id: seal
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.execute.outcome != 'skipped' }}
        shell: pwsh
        env:
          EVIDENCE_KEY_B64: ${{ secrets.EVIDENCE_KEY_B64_02 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://raw.githubusercontent.com/aviajubs-ux/validation-gateway/' + $env:GITHUB_SHA
          Invoke-WebRequest -Uri ($base + '/.github/scripts/seal.ps1') -OutFile (Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1') -MaximumRedirection 3 -ErrorAction Stop
          & (Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1')
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1') -Force -ErrorAction SilentlyContinue
      - name: Publish encrypted evidence only
        if: ${{ always() && steps.seal.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-linux-evidence
          path: sealed/evidence.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report generic outcome
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ '${{ steps.preflight.outcome }}' != 'success' ]]; then
            echo "CONFIGURATION_REQUIRED"
          elif [[ '${{ steps.execute.outputs.status }}' == 'PASS' ]]; then
            echo "CONTROLLED_TASK_COMPLETED"
          else
            echo "CONTROLLED_TASK_REQUIRES_REVIEW"
          fi
