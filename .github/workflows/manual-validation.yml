name: Controlled Validation
run-name: "Validation lane ${{ inputs.lane }}"
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Isolated execution lane
        required: true
        type: choice
        options: ['01','02','03']
permissions:
  contents: read
concurrency:
  group: controlled-validation-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  execute:
    name: Isolated validation task
    runs-on: windows-2025
    timeout-minutes: 330
    environment:
      name: brain-validation
    permissions:
      contents: read
    steps:
      - name: Load pinned generic executor without repository credentials
        id: executor
        shell: pwsh
        run: |
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/execute.ps1?ref=bd82e6b951b21aa5c8d134d159cd86c8f100eb32'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne '8d4aaef31b658ab6525885e3aabf5646a0b361b4' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_EXECUTOR_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $scriptPath = Join-Path $env:RUNNER_TEMP 'generic-executor.ps1'
          [IO.File]::WriteAllBytes($scriptPath,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("path={0}" -f $scriptPath)
          Write-Output 'TRUSTED_EXECUTOR_LOADED'
      - name: Validate lane secrets are configured
        id: preflight
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $required = @('LANE_SOURCE_URL','LANE_SOURCE_SHA256','LANE_EVIDENCE_KEY_B64')
          $missing = [System.Collections.Generic.List[string]]::new()
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing.Add($name) }
          }
          if ($missing.Count -gt 0) {
            Write-Output ('CONFIG_MISSING: ' + ($missing -join ', '))
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'LANE_CONFIGURATION_PRESENT'

      - name: Execute isolated validation
        id: execute
        if: ${{ steps.preflight.outcome == 'success' && steps.executor.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:SOURCE_URL = $env:LANE_SOURCE_URL
          $env:SOURCE_SHA256 = $env:LANE_SOURCE_SHA256
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_SOURCE_URL,Env:LANE_SOURCE_SHA256,Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $executorPath = '${{ steps.executor.outputs.path }}'
          & $executorPath -Lane $lane
      - name: Seal evidence
        id: seal
        if: ${{ always() && steps.preflight.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/seal.ps1?ref=bd82e6b951b21aa5c8d134d159cd86c8f100eb32'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne 'd46036edbfb8a3866336eb10d6289caf0bb4c7ff' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_SEAL_SCRIPT_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $sealScript = Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1'
          [IO.File]::WriteAllBytes($sealScript,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          & $sealScript
          Remove-Item -LiteralPath $sealScript -Force -ErrorAction SilentlyContinue
      - name: Publish encrypted evidence only
        if: ${{ always() && steps.seal.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-evidence-${{ inputs.lane }}
          path: sealed/evidence.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report generic outcome
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.preflight.outcome }}' -ne 'success') {
            Write-Output 'CONFIGURATION_REQUIRED'
          } elseif ('${{ steps.execute.outputs.status }}' -like 'PASS_*') {
            Write-Output 'CONTROLLED_TASK_COMPLETED'
          } else {
            Write-Output 'CONTROLLED_TASK_REQUIRES_REVIEW'
          }
