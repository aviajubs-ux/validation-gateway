name: Controlled Validation
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Validation lane {0}', inputs.lane) || 'Public gateway self-test' }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-validation.yml'
      - '.github/scripts/execute.ps1'
      - '.github/scripts/seal.ps1'
  workflow_dispatch:
    inputs:
      lane:
        description: Isolated execution lane
        required: true
        type: choice
        options: ['01','02','03']
permissions:
  contents: read
concurrency:
  group: controlled-validation-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  public-gateway-self-test:
    if: ${{ github.event_name == 'push' }}
    name: Public gateway integrity and policy self-test
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify public scripts and run generic regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'gateway-self-test'
          $reportDir = Join-Path $env:GITHUB_WORKSPACE '.gateway-self-test'
          New-Item -ItemType Directory -Path $root,$reportDir -Force | Out-Null
          $checks = [System.Collections.Generic.List[object]]::new()
          $failures = [System.Collections.Generic.List[string]]::new()

          function Add-Check([string]$Name,[bool]$Passed) {
            $script:checks.Add([ordered]@{ name = $Name; status = if ($Passed) { 'PASS' } else { 'FAIL' } })
            if (-not $Passed) { $script:failures.Add($Name) }
          }

          function Get-VerifiedRepositoryText([string]$Path) {
            $uri = "https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/$Path?ref=$env:GITHUB_SHA"
            $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' } -ErrorAction Stop
            if ($item.encoding -ne 'base64' -or [string]::IsNullOrWhiteSpace($item.sha)) { throw 'REPOSITORY_FILE_ENCODING_INVALID' }
            $bytes = [Convert]::FromBase64String(($item.content -replace '\s',''))
            $header = [Text.Encoding]::UTF8.GetBytes("blob $($bytes.Length)`0")
            $blob = [byte[]]::new($header.Length + $bytes.Length)
            [Buffer]::BlockCopy($header,0,$blob,0,$header.Length)
            [Buffer]::BlockCopy($bytes,0,$blob,$header.Length,$bytes.Length)
            $digest = [Security.Cryptography.SHA1]::HashData($blob)
            $actual = [Convert]::ToHexString($digest).ToLowerInvariant()
            if ($actual -ne $item.sha.ToLowerInvariant()) { throw 'REPOSITORY_FILE_BLOB_HASH_MISMATCH' }
            $local = Join-Path $root ([IO.Path]::GetFileName($Path))
            [IO.File]::WriteAllBytes($local,$bytes)
            [Array]::Clear($bytes,0,$bytes.Length)
            [Array]::Clear($blob,0,$blob.Length)
            [Array]::Clear($digest,0,$digest.Length)
            return [ordered]@{
              text = [IO.File]::ReadAllText($local,[Text.UTF8Encoding]::new($false))
              path = $local
              blob_sha = $actual
            }
          }

          try {
            $execute = Get-VerifiedRepositoryText '.github/scripts/execute.ps1'
            $seal = Get-VerifiedRepositoryText '.github/scripts/seal.ps1'
            $workflow = Get-VerifiedRepositoryText '.github/workflows/manual-validation.yml'

            foreach ($entry in @(@{name='executor';file=$execute},@{name='sealer';file=$seal})) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($entry.file.path,[ref]$tokens,[ref]$parseErrors) | Out-Null
              Add-Check "$($entry.name)_powershell_syntax" ($parseErrors.Count -eq 0)
            }

            $e = $execute.text
            Add-Check 'evidence_file_count_limit' ($e.Contains('$items.Count -gt 10000'))
            Add-Check 'evidence_single_file_limit' ($e.Contains('$item.Length -gt 50MB'))
            Add-Check 'evidence_total_size_limit' ($e.Contains('$totalBytes -gt 200MB'))
            Add-Check 'evidence_path_containment' ($e.Contains('$full.StartsWith($root'))
            Add-Check 'evidence_reparse_point_rejection' ($e.Contains('CANDIDATE_EVIDENCE_REPARSE_POINT_REJECTED'))
            Add-Check 'candidate_scoped_write_acl' ($e.Contains('@($buildRoot,$candidateOutputRoot,$script:candidateTemp)'))
            Add-Check 'candidate_egress_block_rule' ($e.Contains('-Direction Outbound -Action Block'))
            Add-Check 'candidate_secret_environment_clear' ($e.Contains('Remove-Item -LiteralPath ("Env:" + $name)'))
            Add-Check 'candidate_environment_allowlist' ($e.Contains('$safeEnvironment = @(') -and $e.Contains('$psi.Environment.Clear()'))
            Add-Check 'candidate_identity_is_explicit' ($e.Contains('$psi.UserName = $script:candidateUserName'))

            $s = $seal.text
            Add-Check 'evidence_aes_gcm_encryption' ($s.Contains('[Security.Cryptography.AesGcm]'))
            Add-Check 'evidence_decryption_self_check' ($s.Contains('$aes.Decrypt('))
            Add-Check 'evidence_encryption_self_check' ($s.Contains('$aes.Encrypt('))
            Add-Check 'evidence_key_zeroization' ($s.Contains('[Array]::Clear($key,0,$key.Length)'))
            Add-Check 'plaintext_archive_cleanup' ($s.Contains('Remove-Item -LiteralPath $plainArchive'))

            $w = $workflow.text
            Add-Check 'manual_dispatch_retained' ($w.Contains('workflow_dispatch:'))
            Add-Check 'public_push_self_test_enabled' ($w.Contains('public-gateway-self-test:') -and $w.Contains("github.event_name == 'push'"))
            Add-Check 'product_lane_dispatch_only' ($w.Contains("github.event_name == 'workflow_dispatch'"))
            Add-Check 'no_checkout_or_repository_token' (-not $w.Contains('actions/checkout@') -and -not $w.Contains('GITHUB_TOKEN'))
            $uses = [regex]::Matches($w,'(?m)^\s*uses:\s*[^\s@]+@([0-9a-f]{40})\s*
    runs-on: windows-2025
    timeout-minutes: 330
    environment:
      name: brain-validation
    permissions:
      contents: read
    steps:
      - name: Validate lane secrets are configured
        id: preflight
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $required = @(
            @{ Env = 'LANE_SOURCE_URL'; Secret = "SOURCE_URL_$lane" },
            @{ Env = 'LANE_SOURCE_SHA256'; Secret = "SOURCE_SHA256_$lane" },
            @{ Env = 'LANE_EVIDENCE_KEY_B64'; Secret = "EVIDENCE_KEY_B64_$lane" }
          )
          $missing = [System.Collections.Generic.List[string]]::new()
          foreach ($item in $required) {
            $value = [Environment]::GetEnvironmentVariable($item.Env)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing.Add($item.Secret) }
          }
          if ($missing.Count -gt 0) {
            Write-Output ('CONFIG_MISSING_SECRETS: ' + ($missing -join ', '))
            Write-Output 'CONFIG_EXPECTED_SCOPE: environment brain-validation'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }

          if ($env:LANE_SOURCE_URL -notmatch '^https://') {
            Write-Output 'CONFIG_SOURCE_URL_INVALID: HTTPS_URL_REQUIRED'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          if ($env:LANE_SOURCE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            Write-Output 'CONFIG_SOURCE_SHA256_INVALID'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          try {
            $keyBytes = [Convert]::FromBase64String($env:LANE_EVIDENCE_KEY_B64)
            if ($keyBytes.Length -ne 32) { throw 'INVALID_LENGTH' }
            [Array]::Clear($keyBytes,0,$keyBytes.Length)
            $keyBytes = $null
          } catch {
            if ($keyBytes) { [Array]::Clear($keyBytes,0,$keyBytes.Length) }
            Write-Output 'CONFIG_EVIDENCE_KEY_INVALID: EXPECTED_BASE64_32_BYTES'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }

          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'LANE_CONFIGURATION_VALID'
      - name: Load pinned generic executor without repository credentials
        id: executor
        shell: pwsh
        run: |
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/execute.ps1?ref=4e1878e646263f5a0814c6b349a17587be55e45e'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne '4b6dc63408980e400acb94458e6d675a4f065444' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_EXECUTOR_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $scriptPath = Join-Path $env:RUNNER_TEMP 'generic-executor.ps1'
          [IO.File]::WriteAllBytes($scriptPath,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("path={0}" -f $scriptPath)
          Write-Output 'TRUSTED_EXECUTOR_LOADED'
      - name: Execute isolated validation
        id: execute
        if: ${{ steps.preflight.outcome == 'success' && steps.executor.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:SOURCE_URL = $env:LANE_SOURCE_URL
          $env:SOURCE_SHA256 = $env:LANE_SOURCE_SHA256
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_SOURCE_URL,Env:LANE_SOURCE_SHA256,Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $executorPath = '${{ steps.executor.outputs.path }}'
          & $executorPath -Lane $lane
      - name: Seal evidence
        id: seal
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.executor.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/seal.ps1?ref=c66ecc54e592705fa723720825a361913d5443f9'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne 'd46036edbfb8a3866336eb10d6289caf0bb4c7ff' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_SEAL_SCRIPT_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $sealScript = Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1'
          [IO.File]::WriteAllBytes($sealScript,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          & $sealScript
          Remove-Item -LiteralPath $sealScript -Force -ErrorAction SilentlyContinue
      - name: Publish encrypted evidence only
        if: ${{ always() && steps.seal.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-evidence-${{ inputs.lane }}
          path: sealed/evidence.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report generic outcome
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.preflight.outcome }}' -ne 'success') {
            Write-Output 'CONFIGURATION_REQUIRED'
          } elseif ('${{ steps.execute.outputs.status }}' -like 'PASS_*') {
            Write-Output 'CONTROLLED_TASK_COMPLETED'
          } else {
            Write-Output 'CONTROLLED_TASK_REQUIRES_REVIEW'
          }
)
            $allUsesPinned = $uses.Count -gt 0 -and $uses.Count -eq ([regex]::Matches($w,'(?m)^\s*uses:\s*').Count)
            Add-Check 'workflow_actions_pinned_to_full_sha' $allUsesPinned
          }
          catch {
            $failures.Add('SELF_TEST_SETUP_OR_FETCH_FAILED')
            $checks.Add([ordered]@{ name = 'self_test_setup'; status = 'FAIL' })
          }

          $failed = @($checks | Where-Object { $_.status -ne 'PASS' })
          $report = [ordered]@{
            schema = 'validation.gateway.public_self_test.v1'
            commit = $env:GITHUB_SHA
            runner = 'windows-2025'
            test_count = $checks.Count
            passed = $checks.Count - $failed.Count
            failed = $failed.Count
            results = @($checks)
            outcome = if ($failed.Count -eq 0) { 'PASS' } else { 'FAIL' }
          }
          $reportPath = Join-Path $reportDir 'public-gateway-self-test.json'
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $reportPath -Encoding utf8
          Write-Output ("PUBLIC_GATEWAY_SELF_TEST|{0}|{1}/{2}" -f $report.outcome,$report.passed,$report.test_count)
          if ($failed.Count -gt 0) {
            Write-Output ('FAILED_CHECKS: ' + (($failed | ForEach-Object { $_.name }) -join ','))
            exit 1
          }

      - name: Publish sanitized public self-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-gateway-self-test
          path: .gateway-self-test/public-gateway-self-test.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  execute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Isolated validation task
    runs-on: windows-2025
    timeout-minutes: 330
    environment:
      name: brain-validation
    permissions:
      contents: read
    steps:
      - name: Validate lane secrets are configured
        id: preflight
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $required = @(
            @{ Env = 'LANE_SOURCE_URL'; Secret = "SOURCE_URL_$lane" },
            @{ Env = 'LANE_SOURCE_SHA256'; Secret = "SOURCE_SHA256_$lane" },
            @{ Env = 'LANE_EVIDENCE_KEY_B64'; Secret = "EVIDENCE_KEY_B64_$lane" }
          )
          $missing = [System.Collections.Generic.List[string]]::new()
          foreach ($item in $required) {
            $value = [Environment]::GetEnvironmentVariable($item.Env)
            if ([string]::IsNullOrWhiteSpace($value)) { $missing.Add($item.Secret) }
          }
          if ($missing.Count -gt 0) {
            Write-Output ('CONFIG_MISSING_SECRETS: ' + ($missing -join ', '))
            Write-Output 'CONFIG_EXPECTED_SCOPE: environment brain-validation'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }

          if ($env:LANE_SOURCE_URL -notmatch '^https://') {
            Write-Output 'CONFIG_SOURCE_URL_INVALID: HTTPS_URL_REQUIRED'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          if ($env:LANE_SOURCE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            Write-Output 'CONFIG_SOURCE_SHA256_INVALID'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }
          try {
            $keyBytes = [Convert]::FromBase64String($env:LANE_EVIDENCE_KEY_B64)
            if ($keyBytes.Length -ne 32) { throw 'INVALID_LENGTH' }
            [Array]::Clear($keyBytes,0,$keyBytes.Length)
            $keyBytes = $null
          } catch {
            if ($keyBytes) { [Array]::Clear($keyBytes,0,$keyBytes.Length) }
            Write-Output 'CONFIG_EVIDENCE_KEY_INVALID: EXPECTED_BASE64_32_BYTES'
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 1
          }

          "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output 'LANE_CONFIGURATION_VALID'
      - name: Load pinned generic executor without repository credentials
        id: executor
        shell: pwsh
        run: |
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/execute.ps1?ref=4e1878e646263f5a0814c6b349a17587be55e45e'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne '4b6dc63408980e400acb94458e6d675a4f065444' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_EXECUTOR_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $scriptPath = Join-Path $env:RUNNER_TEMP 'generic-executor.ps1'
          [IO.File]::WriteAllBytes($scriptPath,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("path={0}" -f $scriptPath)
          Write-Output 'TRUSTED_EXECUTOR_LOADED'
      - name: Execute isolated validation
        id: execute
        if: ${{ steps.preflight.outcome == 'success' && steps.executor.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_SOURCE_URL: ${{ secrets[format('SOURCE_URL_{0}', inputs.lane)] }}
          LANE_SOURCE_SHA256: ${{ secrets[format('SOURCE_SHA256_{0}', inputs.lane)] }}
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:SOURCE_URL = $env:LANE_SOURCE_URL
          $env:SOURCE_SHA256 = $env:LANE_SOURCE_SHA256
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_SOURCE_URL,Env:LANE_SOURCE_SHA256,Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $executorPath = '${{ steps.executor.outputs.path }}'
          & $executorPath -Lane $lane
      - name: Seal evidence
        id: seal
        if: ${{ always() && steps.preflight.outcome == 'success' && steps.executor.outcome == 'success' }}
        shell: pwsh
        env:
          LANE_EVIDENCE_KEY_B64: ${{ secrets[format('EVIDENCE_KEY_B64_{0}', inputs.lane)] }}
        run: |
          $lane = '${{ inputs.lane }}'
          $env:EVIDENCE_KEY_B64 = $env:LANE_EVIDENCE_KEY_B64
          Remove-Item Env:LANE_EVIDENCE_KEY_B64 -ErrorAction SilentlyContinue
          $uri = 'https://api.github.com/repos/aviajubs-ux/validation-gateway/contents/.github/scripts/seal.ps1?ref=c66ecc54e592705fa723720825a361913d5443f9'
          $item = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json' } -MaximumRedirection 3 -ErrorAction Stop
          if ($item.sha -ne 'd46036edbfb8a3866336eb10d6289caf0bb4c7ff' -or $item.encoding -ne 'base64') {
            throw 'TRUSTED_SEAL_SCRIPT_INTEGRITY_FAILURE'
          }
          $encoded = ($item.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($encoded)
          $sealScript = Join-Path $env:RUNNER_TEMP 'trusted-sealer.ps1'
          [IO.File]::WriteAllBytes($sealScript,$bytes)
          [Array]::Clear($bytes,0,$bytes.Length)
          & $sealScript
          Remove-Item -LiteralPath $sealScript -Force -ErrorAction SilentlyContinue
      - name: Publish encrypted evidence only
        if: ${{ always() && steps.seal.outputs.sealed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sealed-evidence-${{ inputs.lane }}
          path: sealed/evidence.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Report generic outcome
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ steps.preflight.outcome }}' -ne 'success') {
            Write-Output 'CONFIGURATION_REQUIRED'
          } elseif ('${{ steps.execute.outputs.status }}' -like 'PASS_*') {
            Write-Output 'CONTROLLED_TASK_COMPLETED'
          } else {
            Write-Output 'CONTROLLED_TASK_REQUIRES_REVIEW'
          }
