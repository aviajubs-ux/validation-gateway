name: Public Gateway Self-Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-gateway-self-test.yml"
      - ".github/workflows/manual-validation.yml"
      - ".github/scripts/execute.ps1"
      - ".github/scripts/validation-dependencies.ps1"
      - ".github/scripts/seal.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-gateway-self-test
  cancel-in-progress: false

jobs:
  static-policy-validation:
    name: Public script syntax and policy checks
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Verify pinned public scripts and run checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'gateway-self-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $checks = [System.Collections.Generic.List[object]]::new()
          $failed = [System.Collections.Generic.List[string]]::new()
          $syntaxFindings = [System.Collections.Generic.List[string]]::new()

          function Add-Check {
            param([string]$Name, [bool]$Passed)
            $state = if ($Passed) { 'PASS' } else { 'FAIL' }
            $checks.Add([ordered]@{ name = $Name; status = $state })
            if (-not $Passed) { $failed.Add($Name) }
          }

          function Get-RepositoryScript {
            param([string]$Path, [string]$ExpectedBlobSha)
            $localPath = Join-Path $root ([IO.Path]::GetFileName($Path))
            $uri = "https://raw.githubusercontent.com/aviajubs-ux/validation-gateway/$env:GITHUB_SHA/$Path"
            Invoke-WebRequest -Uri $uri -OutFile $localPath -MaximumRedirection 3 -ErrorAction Stop

            $bytes = [IO.File]::ReadAllBytes($localPath)
            $header = [Text.Encoding]::UTF8.GetBytes("blob $($bytes.Length)`0")
            $blob = [byte[]]::new($header.Length + $bytes.Length)
            [Buffer]::BlockCopy($header, 0, $blob, 0, $header.Length)
            [Buffer]::BlockCopy($bytes, 0, $blob, $header.Length, $bytes.Length)
            $sha1 = [Security.Cryptography.SHA1]::Create()
            try { $digest = $sha1.ComputeHash($blob) } finally { $sha1.Dispose() }
            $actualSha = [Convert]::ToHexString($digest).ToLowerInvariant()
            [Array]::Clear($blob, 0, $blob.Length)
            [Array]::Clear($digest, 0, $digest.Length)
            [Array]::Clear($bytes, 0, $bytes.Length)

            if ($actualSha -ne $ExpectedBlobSha) {
              throw 'REPOSITORY_SCRIPT_BLOB_SHA_MISMATCH'
            }
            return [ordered]@{
              path = $localPath
              text = [IO.File]::ReadAllText($localPath, [Text.UTF8Encoding]::new($false))
              sha = $actualSha
            }
          }
          $stage = 'fetch_executor'
          try {
            $executor = Get-RepositoryScript '.github/scripts/execute.ps1' 'e77b02c4387b24b2ee4a8b416757fd9c25812157'
            $stage = 'fetch_sealer'
            $sealer = Get-RepositoryScript '.github/scripts/seal.ps1' 'd46036edbfb8a3866336eb10d6289caf0bb4c7ff'
            $stage = 'fetch_dependency_bootstrap'
            $dependencyBootstrap = Get-RepositoryScript '.github/scripts/validation-dependencies.ps1' '5d4b21317ed426a30e2e981e78f1b8fe7ef822ea'

            $stage = 'parse_scripts'

            $stage = 'parse_scripts'
            foreach ($scriptItem in @(
              @{ name = 'executor'; value = $executor },
              @{ name = 'sealer'; value = $sealer },
              @{ name = 'dependency_bootstrap'; value = $dependencyBootstrap }
            )) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $scriptItem.value.path, [ref]$tokens, [ref]$parseErrors
              ) | Out-Null
              foreach ($parseError in $parseErrors) {
                $syntaxFindings.Add(("{0}:{1}:{2}" -f $scriptItem.name, $parseError.Extent.StartLineNumber, $parseError.ErrorId))
              }
              Add-Check -Name "$($scriptItem.name)_powershell_syntax" -Passed ($parseErrors.Count -eq 0)
            }

            $e = $executor.text
            Add-Check -Name 'evidence_file_count_bounded' -Passed ($e.Contains('$items.Count -gt 10000'))
            Add-Check -Name 'evidence_single_file_size_bounded' -Passed ($e.Contains('$item.Length -gt 50MB'))
            Add-Check -Name 'evidence_total_size_bounded' -Passed ($e.Contains('$totalBytes -gt 200MB'))
            Add-Check -Name 'evidence_path_containment' -Passed ($e.Contains('$full.StartsWith($root'))
            Add-Check -Name 'evidence_reparse_points_rejected' -Passed ($e.Contains('CANDIDATE_EVIDENCE_REPARSE_POINT_REJECTED'))
            Add-Check -Name 'candidate_write_acl_is_scoped' -Passed ($e.Contains('@($buildRoot,$candidateOutputRoot,$script:candidateTemp)'))
            Add-Check -Name 'candidate_payload_is_read_only' -Passed ($e.Contains('$icacls $payloadRoot /deny $sidAceModify'))
            Add-Check -Name 'candidate_payload_read_is_allowed' -Passed ($e.Contains('$icacls $payloadRoot /grant $sidAceRead'))
            Add-Check -Name 'candidate_network_egress_blocked' -Passed ($e.Contains('-Direction Outbound -Action Block'))
            Add-Check -Name 'candidate_secret_environment_cleared' -Passed ($e.Contains('Remove-Item -LiteralPath ("Env:" + $name)'))
            Add-Check -Name 'candidate_environment_allowlisted' -Passed ($e.Contains('$safeEnvironment = @(') -and $e.Contains('$psi.Environment.Clear()'))
            Add-Check -Name 'candidate_runs_as_temporary_user' -Passed ($e.Contains('$psi.UserName = $script:candidateUserName'))

            $d = $dependencyBootstrap.text
            Add-Check -Name 'dependency_bootstrap_host_allowlist' -Passed ($d.Contains("files.pythonhosted.org"))
            Add-Check -Name 'dependency_bootstrap_hash_verification' -Passed ($d.Contains('VALIDATION_DEPENDENCY_HASH_MISMATCH'))
            Add-Check -Name 'dependency_bootstrap_offline_pip' -Passed ($d.Contains('--no-index') -and $d.Contains('--require-hashes'))
            Add-Check -Name 'dependency_bootstrap_cpython_arch_check' -Passed ($d.Contains("platform.machine().lower()"))
            
            $s = $sealer.text
            Add-Check -Name 'evidence_aes_gcm_encryption' -Passed ($s.Contains('[Security.Cryptography.AesGcm]'))
            Add-Check -Name 'evidence_encrypt_decrypt_self_check' -Passed ($s.Contains('$aes.Encrypt(') -and $s.Contains('$aes.Decrypt('))
            Add-Check -Name 'evidence_encryption_key_zeroized' -Passed ($s.Contains('[Array]::Clear($key,0,$key.Length)'))
            Add-Check -Name 'plaintext_archive_removed' -Passed ($s.Contains('Remove-Item -LiteralPath $plainArchive'))
          }
          catch {
            $failureMessage = [string]$_.Exception.Message
            $failureMessage = $failureMessage -replace 'https?://[^\s]+', 'URL_REDACTED'
            $failureMessage = $failureMessage -replace '[A-Za-z]:\\[^\s]+', 'PATH_REDACTED'
            $failed.Add('SCRIPT_FETCH_OR_VALIDATION_ERROR')
            $checks.Add([ordered]@{ name = 'script_fetch_and_validation'; status = 'FAIL' })
            Write-Output ('PUBLIC_SCRIPT_VALIDATION_ERROR|' + $stage + '|' + $_.Exception.GetType().Name + '|' + $failureMessage)
          }

          $failCount = @($checks | Where-Object { $_.status -eq 'FAIL' }).Count
          $report = [ordered]@{
            schema = 'validation.gateway.public_policy_self_test.v1'
            commit = $env:GITHUB_SHA
            runner = 'windows-2025'
            checks = @($checks)
            syntax_findings = @($syntaxFindings)
            total = $checks.Count
            passed = $checks.Count - $failCount
            failed = $failCount
            outcome = if ($failCount -eq 0) { 'PASS' } else { 'FAIL' }
          }
          $reportPath = Join-Path $root 'public-policy-self-test.json'
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $reportPath -Encoding utf8
          Write-Output ("PUBLIC_POLICY_SELF_TEST|{0}|{1}/{2}" -f $report.outcome, $report.passed, $report.total)
          foreach ($finding in $syntaxFindings) { Write-Output ("POWERSHELL_PARSE_ERROR|" + $finding) }
          if ($failCount -gt 0) { exit 1 }

      - name: Upload public test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-gateway-policy-self-test
          path: ${{ runner.temp }}/gateway-self-test/public-policy-self-test.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
