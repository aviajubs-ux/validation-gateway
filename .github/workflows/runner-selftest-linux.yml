name: Public Linux Runner Self-Test
on:
  push:
    branches:
      - work/validation-gateway-bounded-process-20261126
permissions:
  contents: read
jobs:
  bounded-linux-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare exact generic Linux executor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-selftest-context"
          base="https://raw.githubusercontent.com/aviajubs-ux/validation-gateway/$GITHUB_SHA"
          curl --fail --location --silent --show-error "$base/.github/docker/linux-validation.Dockerfile" -o "$RUNNER_TEMP/linux-selftest-context/Dockerfile"
          curl --fail --location --silent --show-error "$base/.github/scripts/execute-linux-inner.sh" -o "$RUNNER_TEMP/linux-selftest-context/execute-linux-inner.sh"
          chmod 0555 "$RUNNER_TEMP/linux-selftest-context/execute-linux-inner.sh"
          docker build --pull --tag "teli-linux-validation:$GITHUB_SHA" "$RUNNER_TEMP/linux-selftest-context"
          echo "LINUX_EXECUTOR_IMAGE_BUILT"
      - name: Create isolated deterministic CMake fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux-fixture/tests"
          cat > "$RUNNER_TEMP/linux-fixture/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(validation_fixture LANGUAGES CXX)
          include(CTest)
          option(UCE_BUILD_TESTS "Build fixture tests" ON)
          if(UCE_BUILD_TESTS)
            add_executable(uce_science_operations_tests tests/smoke.cpp)
            add_test(NAME uce_science_operations_tests COMMAND uce_science_operations_tests)
            if(EXISTS "\${CMAKE_SOURCE_DIR}/INJECT_SKIP")
              add_test(NAME intentional_skip COMMAND bash -c "exit 77")
              set_tests_properties(intentional_skip PROPERTIES SKIP_RETURN_CODE 77)
            endif()
          endif()
          CMAKE
          cat > "$RUNNER_TEMP/linux-fixture/tests/smoke.cpp" <<'CPP'
          #include <cstdlib>
          int main() {
              const int a = 21;
              const int b = 21;
              return (a + b == 42) ? EXIT_SUCCESS : EXIT_FAILURE;
          }
          CPP
          echo "DETERMINISTIC_FIXTURE_CREATED"
      - name: Verify Linux container isolation and run ON/OFF/Sanitizer suite
        id: positive
        shell: bash
        run: |
          set -euo pipefail
          image="teli-linux-validation:$GITHUB_SHA"
          fixture="$RUNNER_TEMP/linux-fixture"
          evidence="$RUNNER_TEMP/linux-selftest-evidence"
          mkdir -p "$evidence/positive"

          cid="$(docker create \
            --network none --read-only \
            --memory 6g --memory-swap 6g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-on:rw,nosuid,nodev,size=3g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-off:rw,nosuid,nodev,size=1g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-san:rw,nosuid,nodev,size=3g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /evidence:rw,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=1777 \
            --mount "type=bind,src=$fixture,dst=/src,readonly" \
            --entrypoint /bin/bash "$image" -euc 'id; ls -ld /evidence /build-on /build-off /build-san /tmp; touch /evidence/write-probe.txt; exec bash -x /usr/local/bin/execute-linux-inner.sh /src')"
          docker inspect "$cid" --format 'memory={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCpus}} pids_limit={{.HostConfig.PidsLimit}} network={{.HostConfig.NetworkMode}} readonly={{.HostConfig.ReadonlyRootfs}}' | tee "$evidence/container-config.txt"
          set +e
          docker start --attach "$cid"
          result=$?
          set -e
          if ! docker cp "$cid:/evidence/." "$evidence/positive/" >/dev/null 2>&1; then
            echo "EVIDENCE_COPY_FAILED"
            exit 1
          fi
          echo "--- CONTAINER STATE ---"
          docker inspect "$cid" --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
          echo "--- CONTAINER LOGS ---"
          docker logs "$cid" 2>&1 | tail -n 240 || true
          echo "LINUX_FIXTURE_EXIT_CODE=$result"
          docker rm "$cid" >/dev/null
          if [[ -f "$evidence/positive/stages.env" ]]; then
            echo "--- STAGES ---"
            cat "$evidence/positive/stages.env"
          fi
          for f in "$evidence"/positive/*.log "$evidence"/positive/*.txt; do
            [[ -f "$f" ]] || continue
            echo "--- LOG: $(basename "$f") ---"
            tail -n 160 "$f"
          done
          if [[ "$result" -ne 0 ]]; then
            echo "LINUX_FIXTURE_VALIDATION_FAILED"
            exit 1
          fi
          python3 - "$evidence/positive/execution-result.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          d=json.loads(p.read_text())
          s=d.get("stages",{})
          required=("configure_on","build_on","ctest_on","configure_off","off_gate","build_off","configure_sanitizers","build_sanitizers","ctest_sanitizers")
          failed={k:s.get(k) for k in required if s.get(k)!="PASS"}
          counts=d.get("ctest_on_counts",{})
          if failed or counts.get("tests",0)<1 or counts.get("failures",0) or counts.get("errors",0) or counts.get("skipped",0):
              raise SystemExit("LINUX_FIXTURE_RESULT_NOT_CLEAN: "+repr({"failed":failed,"counts":counts}))
          print("LINUX_FIXTURE_ON_OFF_SANITIZER_PASS", counts)
          PY
      - name: Verify skip is rejected as non-PASS
        shell: bash
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/linux-fixture/INJECT_SKIP"
          image="teli-linux-validation:$GITHUB_SHA"
          fixture="$RUNNER_TEMP/linux-fixture"
          evidence="$RUNNER_TEMP/linux-selftest-evidence"
          mkdir -p "$evidence/negative"
          cid="$(docker create \
            --network none --read-only \
            --memory 6g --memory-swap 6g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-on:rw,nosuid,nodev,size=3g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-off:rw,nosuid,nodev,size=1g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /build-san:rw,nosuid,nodev,size=3g,uid=65532,gid=65532,mode=1777 \
            --tmpfs /evidence:rw,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=1777 \
            --mount "type=bind,src=$fixture,dst=/src,readonly" \
            "$image" /src)"
          set +e
          docker start --attach "$cid"
          result=$?
          set -e
          docker cp "$cid:/evidence/." "$evidence/negative/" >/dev/null 2>&1
          docker rm "$cid" >/dev/null
          if [[ "$result" -eq 0 ]]; then
            echo "SELFTEST_FAILURE_SKIP_WAS_ACCEPTED"
            exit 1
          fi
          python3 - "$evidence/negative/execution-result.json" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          status=d.get("stages",{}).get("ctest_on")
          counts=d.get("ctest_on_counts",{})
          if status!="FAIL_OR_SKIP" or counts.get("skipped",0)<1:
              raise SystemExit("SELFTEST_FAILURE_SKIP_NOT_DETECTED: "+repr({"status":status,"counts":counts}))
          print("LINUX_SELFTEST_SKIP_REJECTED", status, counts)
          PY
      - name: Verify sandbox network, read-only root, and standard identity
        shell: bash
        run: |
          set -euo pipefail
          image="teli-linux-validation:$GITHUB_SHA"
          docker run --rm --network none --read-only \
            --memory 256m --memory-swap 256m --cpus 1 --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 \
            --entrypoint /bin/bash "$image" -euc '
              test "$(id -u)" = "65532"
              if touch /root/should-not-write 2>/dev/null; then exit 21; fi
              python3 -c "import socket; s=socket.socket(); s.settimeout(1); rc=s.connect_ex(('1.1.1.1',443)); s.close(); assert rc != 0"
              echo "NETWORK_BLOCKED READONLY_ROOT STANDARD_USER PASS"
            '
      - name: Preserve Linux runner self-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-runner-selftest-evidence
          path: ${{ runner.temp }}/linux-selftest-evidence
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Clean up images and temporary directories
        if: always()
        shell: bash
        run: |
          docker image rm "teli-linux-validation:$GITHUB_SHA" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/linux-selftest-context" "$RUNNER_TEMP/linux-fixture" "$RUNNER_TEMP/linux-selftest-evidence"
